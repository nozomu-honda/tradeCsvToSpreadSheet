<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 760px;
        margin: 32px auto;
        padding: 0 16px;
        line-height: 1.6;
      }
      input, button {
        font-size: 16px;
        padding: 10px 12px;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
      }
      button {
        margin-top: 12px;
        cursor: pointer;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 20px;
      }
      .muted {
        color: #666;
        font-size: 14px;
      }
      .ok {
        color: #0b8043;
        white-space: pre-wrap;
      }
      .err {
        color: #d93025;
        white-space: pre-wrap;
      }
      .row {
        margin-top: 14px;
      }
      .sep {
        margin: 18px 0;
        text-align: center;
        color: #888;
      }
      .link-block {
        margin-top: 10px;
      }
      .button-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .danger {
        background: #fff5f5;
        border: 1px solid #d93025;
        color: #d93025;
      }
      a {
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>CSVから4シート生成</h2>
      <p class="muted">
        CSVリンク、またはローカルCSVアップロードのどちらかで実行できます。
      </p>

      <div class="row">
        <label for="csvUrl">CSVリンク</label>
        <input id="csvUrl" type="text" value="<?= initialCsvUrl ?>" placeholder="https://..." />
      </div>

      <div class="sep">または</div>

      <div class="row">
        <label for="csvFile">ローカルCSVファイル</label>
        <input id="csvFile" type="file" accept=".csv,text/csv" />
      </div>

      <div class="row button-row">
        <button id="runButton" onclick="run()">実行</button>
        <button id="resetDbButton" class="danger" onclick="resetDb()">データベースをリセット</button>
      </div>

      <div id="status" class="row muted"></div>
      <pre id="result" class="row"></pre>
      <div id="linkArea" class="row"></div>
    </div>

    <script>
      async function run() {
        const csvUrl = document.getElementById('csvUrl').value.trim();
        const fileInput = document.getElementById('csvFile');
        const file = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;

        const status = document.getElementById('status');
        const result = document.getElementById('result');
        const linkArea = document.getElementById('linkArea');

        clearOutput_();

        if (!csvUrl && !file) {
          result.className = 'err';
          result.textContent = 'CSVリンクかCSVファイルのどちらかを指定してください。';
          return;
        }

        if (csvUrl && file) {
          result.className = 'err';
          result.textContent = 'CSVリンクとCSVファイルは同時に指定せず、どちらか一方にしてください。';
          return;
        }

        setBusy_(true);
        status.textContent = '実行中...';

        try {
          let payload;

          if (file) {
            const uploadedCsvText = await readFileAsTextWithFallback(file);
            payload = {
              csvUrl: '',
              uploadedCsvText: uploadedCsvText,
              uploadedFileName: file.name
            };
          } else {
            payload = {
              csvUrl: csvUrl,
              uploadedCsvText: '',
              uploadedFileName: ''
            };
          }

          google.script.run
            .withSuccessHandler(function(res) {
              setBusy_(false);
              status.textContent = '';
              result.className = 'ok';

              let alertText = '';
              if (res.alerts && res.alerts.length > 0) {
                alertText = '\n\nアラート:\n- ' + res.alerts.join('\n- ');
              }

              let dbText = '';
              if (res.db) {
                dbText =
                  '\n\nDB取込結果:\n' +
                  '取込ID: ' + (res.db.importId || '') + '\n' +
                  '読込件数: ' + (res.db.rowCount || 0) + '\n' +
                  '追加件数: ' + (res.db.insertedCount || 0) + '\n' +
                  'スキップ件数: ' + (res.db.skippedCount || 0);
              }

              result.textContent =
                '完了しました。\n\n' +
                '入力方法: ' + (res.inputType === 'upload' ? 'アップロード' : 'リンク') + '\n' +
                'スプレッドシート名: ' + res.spreadsheetName + '\n' +
                '元データシート: ' + (res.sourceSheetName || '') + '\n' +
                '全件数: ' + res.counts.all + '\n' +
                '国内取引: ' + res.counts.domestic + '\n' +
                '外国取引: ' + res.counts.foreign + '\n' +
                '金銭残高（円）: ' + res.counts.cashJpy + '\n' +
                '金銭残高（ドル）: ' + res.counts.cashUsd +
                dbText +
                alertText;

              appendLink(linkArea, res.spreadsheetUrl, '作成したスプレッドシートを開く');

              if (res.db && res.db.dbSpreadsheetUrl) {
                appendLink(linkArea, res.db.dbSpreadsheetUrl, '取引DBを開く');
              }
            })
            .withFailureHandler(function(err) {
              setBusy_(false);
              status.textContent = '';
              result.className = 'err';
              result.textContent = err && err.message ? err.message : String(err);
            })
            .runFromWebApp(payload);
        } catch (e) {
          setBusy_(false);
          status.textContent = '';
          result.className = 'err';
          result.textContent = e && e.message ? e.message : String(e);
        }
      }

      function resetDb() {
        const confirmed = window.confirm('本当に削除しますか？');
        if (!confirmed) {
          return;
        }

        const status = document.getElementById('status');
        const result = document.getElementById('result');
        const linkArea = document.getElementById('linkArea');

        clearOutput_();
        setBusy_(true);
        status.textContent = 'データベースをリセット中...';

        google.script.run
          .withSuccessHandler(function(res) {
            setBusy_(false);
            status.textContent = '';
            result.className = 'ok';
            result.textContent =
              'データベースをリセットしました。\n\n' +
              '取引DB削除件数: ' + (res.deletedTransactionCount || 0) + '\n' +
              '取込履歴削除件数: ' + (res.deletedImportLogCount || 0);

            if (res.dbSpreadsheetUrl) {
              appendLink(linkArea, res.dbSpreadsheetUrl, '取引DBを開く');
            }
          })
          .withFailureHandler(function(err) {
            setBusy_(false);
            status.textContent = '';
            result.className = 'err';
            result.textContent = err && err.message ? err.message : String(err);
          })
          .resetDbFromWebApp();
      }

      function setBusy_(isBusy) {
        document.getElementById('runButton').disabled = isBusy;
        document.getElementById('resetDbButton').disabled = isBusy;
      }

      function clearOutput_() {
        const result = document.getElementById('result');
        const linkArea = document.getElementById('linkArea');
        result.className = '';
        result.textContent = '';
        linkArea.innerHTML = '';
      }

      function appendLink(container, href, text) {
        const div = document.createElement('div');
        div.className = 'link-block';

        const a = document.createElement('a');
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = text;

        div.appendChild(a);
        container.appendChild(div);
      }

      async function readFileAsTextWithFallback(file) {
        const utf8 = await readFileAsText(file, 'utf-8');
        if (!utf8.includes('�')) {
          return utf8;
        }

        try {
          const sjis = await readFileAsText(file, 'shift-jis');
          return sjis;
        } catch (e) {
          return utf8;
        }
      }

      function readFileAsText(file, encoding) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = function() {
            resolve(reader.result);
          };
          reader.onerror = function() {
            reject(new Error('ファイルの読み込みに失敗しました。'));
          };
          reader.readAsText(file, encoding);
        });
      }
    </script>
  </body>
</html>
