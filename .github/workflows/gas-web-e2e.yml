name: GAS Web App E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled

permissions:
  contents: read

concurrency:
  group: gas-web-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gas-web-e2e:
    name: Deploy test Web app and run Playwright
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'gas-web-e2e')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CI tools
        run: |
          npm install --global @google/clasp
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium

      - name: Push source and update fixed test Web app deployment
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_USER: ${{ secrets.CLASP_USER }}
          GAS_TEST_SCRIPT_ID: ${{ secrets.GAS_TEST_SCRIPT_ID }}
          GAS_TEST_WEBAPP_DEPLOYMENT_ID: ${{ secrets.GAS_TEST_WEBAPP_DEPLOYMENT_ID }}
          GAS_TEST_WEBAPP_URL: ${{ secrets.GAS_TEST_WEBAPP_URL }}
          CLASP_PROJECT_JSON: ${{ secrets.CLASP_PROJECT_JSON }}
        run: bash scripts/ci/deploy-test-webapp.sh

      - name: Run Playwright E2E
        env:
          GAS_TEST_WEBAPP_URL: ${{ secrets.GAS_TEST_WEBAPP_URL }}
          E2E_INPUT_SPREADSHEET_URL: ${{ secrets.E2E_INPUT_SPREADSHEET_URL }}
          CI_E2E_TOKEN: ${{ secrets.CI_E2E_TOKEN }}
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gas-web-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  external-pr-guard:
    name: External PR guard
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository
      }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Skip secret-backed Web app E2E
        run: echo "Skipping GAS Web app E2E for fork or external PRs so Google secrets are not exposed."
