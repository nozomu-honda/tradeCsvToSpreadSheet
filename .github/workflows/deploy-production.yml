name: Deploy production

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'trueの場合は本番push、deployment更新、Status Issue更新を行わない'
        required: true
        default: true
        type: boolean
      dry_run_mode:
        description: 'staticは本番Secrets不要、authenticatedは本番認証とstatusを確認'
        required: true
        default: static
        type: choice
        options:
          - static
          - authenticated
      force:
        description: '同じcommitの再反映を許可する場合だけtrue'
        required: true
        default: false
        type: boolean
      target_sha:
        description: '反映対象の最新develop commit SHA。control workflowからdevelop refで渡す'
        required: true
        default: ''
        type: string
      source_pr_number:
        description: '本番反映元PR番号。必須チェック検証に利用する'
        required: false
        default: ''
        type: string

run-name: Production deploy

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: production-state
  cancel-in-progress: false

jobs:
  resolve-production-status-config:
    name: Resolve production status config
    runs-on: ubuntu-latest
    outputs:
      production_status_issue_number: ${{ steps.status-config.outputs.production_status_issue_number }}
    steps:
      - name: Read repository production status variable
        id: status-config
        shell: bash
        run: |
          printf 'production_status_issue_number=%s\n' "${PRODUCTION_STATUS_ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
        env:
          PRODUCTION_STATUS_ISSUE_NUMBER: ${{ vars.PRODUCTION_STATUS_ISSUE_NUMBER }}

  production-preflight:
    name: Production preflight
    needs: resolve-production-status-config
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.preflight.outputs.target_sha }}
      source_pr_number: ${{ steps.preflight.outputs.source_pr_number }}
      preflight_passed: ${{ steps.preflight.outputs.preflight_passed }}
      should_deploy: ${{ steps.preflight.outputs.should_deploy }}
      current_production_sha: ${{ steps.preflight.outputs.current_production_sha }}
      production_status_issue_number: ${{ steps.preflight.outputs.production_status_issue_number }}
      required_checks_verified: ${{ steps.preflight.outputs.required_checks_verified }}
      static_boundary_verified: ${{ steps.preflight.outputs.static_boundary_verified }}
    env:
      PRODUCTION_DEPLOY_PHASE: preflight
      DRY_RUN: ${{ inputs.dry_run }}
      DRY_RUN_MODE: ${{ inputs.dry_run_mode }}
      FORCE: ${{ inputs.force }}
      TARGET_SHA: ${{ inputs.target_sha }}
      SOURCE_PR_NUMBER: ${{ inputs.source_pr_number }}
      PRODUCTION_STATUS_ISSUE_NUMBER: ${{ needs.resolve-production-status-config.outputs.production_status_issue_number }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout trusted develop source
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Pin local branch to origin/develop
        run: |
          git fetch --no-tags origin develop
          git checkout -B develop origin/develop

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Run production preflight
        id: preflight
        shell: bash
        run: node scripts/ci/run-production-deploy.js

      - name: Pack preflight dependencies
        if: ${{ steps.preflight.outputs.preflight_passed == 'true' && (steps.preflight.outputs.should_deploy == 'true' || inputs.dry_run_mode == 'authenticated') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/production-dependencies"
          tar -czf "${RUNNER_TEMP}/production-dependencies/production-node-modules.tgz" node_modules

      - name: Upload preflight dependencies
        if: ${{ steps.preflight.outputs.preflight_passed == 'true' && (steps.preflight.outputs.should_deploy == 'true' || inputs.dry_run_mode == 'authenticated') }}
        uses: actions/upload-artifact@v4
        with:
          name: production-node-modules
          path: ${{ runner.temp }}/production-dependencies/production-node-modules.tgz
          retention-days: 1

  authenticated-production-dry-run:
    name: Authenticated production dry-run
    needs:
      - resolve-production-status-config
      - production-preflight
    runs-on: ubuntu-latest
    if: >-
      ${{
        inputs.dry_run == true &&
        inputs.dry_run_mode == 'authenticated' &&
        needs.production-preflight.result == 'success'
      }}
    environment:
      name: production-preflight
    env:
      PRODUCTION_DEPLOY_PHASE: authenticated-dry-run
      DRY_RUN: ${{ inputs.dry_run }}
      DRY_RUN_MODE: ${{ inputs.dry_run_mode }}
      FORCE: ${{ inputs.force }}
      TARGET_SHA: ${{ inputs.target_sha }}
      SOURCE_PR_NUMBER: ${{ inputs.source_pr_number }}
      PREFLIGHT_TARGET_SHA: ${{ needs.production-preflight.outputs.target_sha }}
      PREFLIGHT_SOURCE_PR_NUMBER: ${{ needs.production-preflight.outputs.source_pr_number }}
      PREFLIGHT_PASSED: ${{ needs.production-preflight.outputs.preflight_passed }}
      PREFLIGHT_SHOULD_DEPLOY: ${{ needs.production-preflight.outputs.should_deploy }}
      PREFLIGHT_CURRENT_PRODUCTION_SHA: ${{ needs.production-preflight.outputs.current_production_sha }}
      PREFLIGHT_PRODUCTION_STATUS_ISSUE_NUMBER: ${{ needs.production-preflight.outputs.production_status_issue_number }}
      PREFLIGHT_REQUIRED_CHECKS_VERIFIED: ${{ needs.production-preflight.outputs.required_checks_verified }}
      PREFLIGHT_STATIC_BOUNDARY_VERIFIED: ${{ needs.production-preflight.outputs.static_boundary_verified }}
      CLASP_PRODUCTION_CREDENTIALS: ${{ secrets.CLASP_PRODUCTION_CREDENTIALS }}
      PRODUCTION_SCRIPT_ID: ${{ secrets.PRODUCTION_SCRIPT_ID }}
      PRODUCTION_DEPLOYMENT_ID: ${{ secrets.PRODUCTION_DEPLOYMENT_ID }}
      PRODUCTION_WEB_APP_URL: ${{ vars.PRODUCTION_WEB_APP_URL }}
      PRODUCTION_SMOKE_MODE: ${{ vars.PRODUCTION_SMOKE_MODE }}
      PRODUCTION_SMOKE_EXPECTED_MARKER: ${{ vars.PRODUCTION_SMOKE_EXPECTED_MARKER }}
      PRODUCTION_STATUS_ISSUE_NUMBER: ${{ needs.resolve-production-status-config.outputs.production_status_issue_number }}
      PRODUCTION_REQUIRED_CHECKS: ${{ vars.PRODUCTION_REQUIRED_CHECKS }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout trusted develop source
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Pin local branch to origin/develop
        run: |
          git fetch --no-tags origin develop
          git checkout -B develop origin/develop

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Download preflight dependencies
        uses: actions/download-artifact@v4
        with:
          name: production-node-modules
          path: ${{ runner.temp }}/production-dependencies

      - name: Restore preflight dependencies
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}/production-dependencies/production-node-modules.tgz"
          rm -rf "${RUNNER_TEMP}/production-dependencies"

      - name: Verify clean working tree after dependency restore
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain=v1 --untracked-files=normal)"
          if [[ -n "${status}" ]]; then
            echo "::error::Working tree is not clean after restoring preflight dependencies."
            printf '%s\n' "${status}"
            exit 1
          fi

      - name: Run authenticated production dry-run
        shell: bash
        run: node scripts/ci/run-production-deploy.js

  deploy-production:
    name: Deploy production
    needs:
      - resolve-production-status-config
      - production-preflight
    runs-on: ubuntu-latest
    if: >-
      ${{
        inputs.dry_run == false &&
        needs.production-preflight.result == 'success' &&
        needs.production-preflight.outputs.should_deploy == 'true'
      }}
    environment:
      name: production
      url: ${{ vars.PRODUCTION_WEB_APP_URL }}
    env:
      PRODUCTION_DEPLOY_PHASE: mutation
      DRY_RUN: ${{ inputs.dry_run }}
      DRY_RUN_MODE: ${{ inputs.dry_run_mode }}
      FORCE: ${{ inputs.force }}
      TARGET_SHA: ${{ inputs.target_sha }}
      SOURCE_PR_NUMBER: ${{ inputs.source_pr_number }}
      PREFLIGHT_TARGET_SHA: ${{ needs.production-preflight.outputs.target_sha }}
      PREFLIGHT_SOURCE_PR_NUMBER: ${{ needs.production-preflight.outputs.source_pr_number }}
      PREFLIGHT_PASSED: ${{ needs.production-preflight.outputs.preflight_passed }}
      PREFLIGHT_SHOULD_DEPLOY: ${{ needs.production-preflight.outputs.should_deploy }}
      PREFLIGHT_CURRENT_PRODUCTION_SHA: ${{ needs.production-preflight.outputs.current_production_sha }}
      PREFLIGHT_PRODUCTION_STATUS_ISSUE_NUMBER: ${{ needs.production-preflight.outputs.production_status_issue_number }}
      PREFLIGHT_REQUIRED_CHECKS_VERIFIED: ${{ needs.production-preflight.outputs.required_checks_verified }}
      PREFLIGHT_STATIC_BOUNDARY_VERIFIED: ${{ needs.production-preflight.outputs.static_boundary_verified }}
      CLASP_PRODUCTION_CREDENTIALS: ${{ secrets.CLASP_PRODUCTION_CREDENTIALS }}
      PRODUCTION_SCRIPT_ID: ${{ secrets.PRODUCTION_SCRIPT_ID }}
      PRODUCTION_DEPLOYMENT_ID: ${{ secrets.PRODUCTION_DEPLOYMENT_ID }}
      PRODUCTION_WEB_APP_URL: ${{ vars.PRODUCTION_WEB_APP_URL }}
      PRODUCTION_SMOKE_MODE: ${{ vars.PRODUCTION_SMOKE_MODE }}
      PRODUCTION_SMOKE_EXPECTED_MARKER: ${{ vars.PRODUCTION_SMOKE_EXPECTED_MARKER }}
      PRODUCTION_STATUS_ISSUE_NUMBER: ${{ needs.resolve-production-status-config.outputs.production_status_issue_number }}
      PRODUCTION_REQUIRED_CHECKS: ${{ vars.PRODUCTION_REQUIRED_CHECKS }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout trusted develop source
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Pin local branch to origin/develop
        run: |
          git fetch --no-tags origin develop
          git checkout -B develop origin/develop

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Download preflight dependencies
        uses: actions/download-artifact@v4
        with:
          name: production-node-modules
          path: ${{ runner.temp }}/production-dependencies

      - name: Restore preflight dependencies
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}/production-dependencies/production-node-modules.tgz"
          rm -rf "${RUNNER_TEMP}/production-dependencies"

      - name: Verify clean working tree after dependency restore
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain=v1 --untracked-files=normal)"
          if [[ -n "${status}" ]]; then
            echo "::error::Working tree is not clean after restoring preflight dependencies."
            printf '%s\n' "${status}"
            exit 1
          fi

      - name: Deploy production mutation
        shell: bash
        run: node scripts/ci/run-production-deploy.js
