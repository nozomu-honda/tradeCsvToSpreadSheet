name: Deploy production

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'trueの場合は本番push、deployment更新、Status Issue更新を行わない'
        required: true
        default: true
        type: boolean
      dry_run_mode:
        description: 'staticは本番Secrets不要、authenticatedは本番認証とstatusを確認'
        required: true
        default: static
        type: choice
        options:
          - static
          - authenticated
      force:
        description: '同じcommitの再反映を許可する場合だけtrue'
        required: true
        default: false
        type: boolean
      target_sha:
        description: '反映対象の最新develop commit SHA。control workflowからdevelop refで渡す'
        required: true
        default: ''
        type: string
      source_pr_number:
        description: '本番反映元PR番号。必須チェック検証に利用する'
        required: false
        default: ''
        type: string

run-name: Production deploy

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: production-state
  cancel-in-progress: false

jobs:
  resolve-production-status-config:
    name: Resolve production status config
    runs-on: ubuntu-latest
    outputs:
      production_status_issue_number: ${{ steps.status-config.outputs.production_status_issue_number }}
    steps:
      - name: Read repository production status variable
        id: status-config
        shell: bash
        run: |
          printf 'production_status_issue_number=%s\n' "${PRODUCTION_STATUS_ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
        env:
          PRODUCTION_STATUS_ISSUE_NUMBER: ${{ vars.PRODUCTION_STATUS_ISSUE_NUMBER }}

  static-dry-run:
    name: Production static dry-run
    needs: resolve-production-status-config
    runs-on: ubuntu-latest
    if: ${{ inputs.dry_run == true && inputs.dry_run_mode == 'static' }}
    env:
      DRY_RUN: 'true'
      DRY_RUN_MODE: static
      FORCE: ${{ inputs.force }}
      TARGET_SHA: ${{ inputs.target_sha }}
      SOURCE_PR_NUMBER: ${{ inputs.source_pr_number }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout trusted develop source
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Pin local branch to origin/develop
        run: |
          git fetch --no-tags origin develop
          git checkout -B develop origin/develop

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Run static production dry-run
        shell: bash
        run: node scripts/ci/run-production-deploy.js

  deploy-production:
    name: Deploy production
    needs: resolve-production-status-config
    runs-on: ubuntu-latest
    if: ${{ inputs.dry_run != true || inputs.dry_run_mode == 'authenticated' }}
    environment:
      name: production
      url: ${{ vars.PRODUCTION_WEB_APP_URL }}
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      DRY_RUN_MODE: ${{ inputs.dry_run_mode }}
      FORCE: ${{ inputs.force }}
      TARGET_SHA: ${{ inputs.target_sha }}
      SOURCE_PR_NUMBER: ${{ inputs.source_pr_number }}
      CLASP_PRODUCTION_CREDENTIALS: ${{ secrets.CLASP_PRODUCTION_CREDENTIALS }}
      PRODUCTION_SCRIPT_ID: ${{ secrets.PRODUCTION_SCRIPT_ID }}
      PRODUCTION_DEPLOYMENT_ID: ${{ secrets.PRODUCTION_DEPLOYMENT_ID }}
      PRODUCTION_WEB_APP_URL: ${{ vars.PRODUCTION_WEB_APP_URL }}
      PRODUCTION_SMOKE_EXPECTED_MARKER: ${{ vars.PRODUCTION_SMOKE_EXPECTED_MARKER }}
      PRODUCTION_STATUS_ISSUE_NUMBER: ${{ needs.resolve-production-status-config.outputs.production_status_issue_number }}
      PRODUCTION_REQUIRED_CHECKS: ${{ vars.PRODUCTION_REQUIRED_CHECKS }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout trusted develop source
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Pin local branch to origin/develop
        run: |
          git fetch --no-tags origin develop
          git checkout -B develop origin/develop

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Preflight and deploy production
        shell: bash
        run: node scripts/ci/run-production-deploy.js
