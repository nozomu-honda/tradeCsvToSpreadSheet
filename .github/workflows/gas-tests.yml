name: GAS Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gas-shared-test-project
  cancel-in-progress: false

jobs:
  gas-tests:
    name: Push test GAS project and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Push to test Apps Script and run GAS tests
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_TEST_SCRIPT_ID: ${{ secrets.GAS_TEST_SCRIPT_ID }}
          GAS_TEST_DEPLOYMENT_ID: ${{ secrets.GAS_TEST_DEPLOYMENT_ID }}
          CLASP_PROJECT_JSON: ${{ secrets.CLASP_PROJECT_JSON }}
          CLASP_USER: ${{ secrets.CLASP_USER }}
        run: bash scripts/ci/run-gas-tests.sh
