name: Final CI

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      base_branch:
        required: true
        type: string
      head_repository:
        required: true
        type: string
      label_name:
        required: true
        type: string

permissions:
  contents: read
  checks: write
  issues: read
  pull-requests: read

jobs:
  final-ci-gate:
    name: Final CI review gate
    runs-on: ubuntu-latest
    concurrency:
      group: final-ci-gate-pr-${{ inputs.pr_number }}
      cancel-in-progress: true
    permissions:
      checks: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      classification: ${{ steps.gate.outputs.classification }}
      current_base_sha: ${{ steps.gate.outputs.current_base_sha }}
      current_head_sha: ${{ steps.gate.outputs.current_head_sha }}
      gas_action: ${{ steps.gate.outputs.gas_action }}
      heavy_job_count: ${{ steps.gate.outputs.heavy_job_count }}
      heavy_jobs: ${{ steps.gate.outputs.heavy_jobs }}
      reason: ${{ steps.gate.outputs.reason }}
      should_run_heavy: ${{ steps.gate.outputs.should_run_heavy }}
      web_action: ${{ steps.gate.outputs.web_action }}
    steps:
      - name: Load review gate from trusted develop base
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/contents/scripts/ci/final-ci.js" \
              -f "ref=${BASE_SHA}" \
              --jq '.content' \
              | tr -d '\n' \
              | base64 --decode > "${RUNNER_TEMP}/final-ci-gate.js"; then
            echo "::error::Trusted Final CI review gate could not be loaded."
            {
              echo "## Final CI review gate"
              echo ""
              echo "- Result: \`rejected\`"
              echo "- Reason: trusted review gate could not be loaded"
              echo "- Heavy runners: \`0\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if ! node --check "${RUNNER_TEMP}/final-ci-gate.js"; then
            echo "::error::Trusted Final CI review gate is invalid."
            {
              echo "## Final CI review gate"
              echo ""
              echo "- Result: \`rejected\`"
              echo "- Reason: trusted review gate is invalid"
              echo "- Heavy runners: \`0\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

      - name: Verify review completion and classify changes
        id: gate
        env:
          EXPECTED_BASE_BRANCH: ${{ inputs.base_branch }}
          EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          LABEL_NAME: ${{ inputs.label_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: node "${RUNNER_TEMP}/final-ci-gate.js" gate

  final-ci-heavy:
    needs:
      - final-ci-gate
    if: >-
      ${{
        needs.final-ci-gate.result == 'success' &&
        needs.final-ci-gate.outputs.allowed == 'true' &&
        needs.final-ci-gate.outputs.should_run_heavy == 'true'
      }}
    uses: ./.github/workflows/final-ci-heavy.yml
    with:
      base_sha: ${{ inputs.base_sha }}
      classification: ${{ needs.final-ci-gate.outputs.classification }}
      gas_action: ${{ needs.final-ci-gate.outputs.gas_action }}
      head_sha: ${{ inputs.head_sha }}
      pr_number: ${{ inputs.pr_number }}
      web_action: ${{ needs.final-ci-gate.outputs.web_action }}
    secrets: inherit
